engineStrict: true
nodeLinker: hoisted
linkWorkspacePackages: true

packages:
  - "apps/*"
  - "tooling/*"

# Workaround: @hey-api/json-schema-ref-parser 1.4.4 pins a vulnerable js-yaml (ADR 0002).
overrides:
  "@hey-api/json-schema-ref-parser>js-yaml": 4.3.2

allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  "@biomejs/biome": true

catalog:
  typescript: 6.0.3
  zod: 4.6.7
  "@biomejs/biome": ^2.6.8
  vite: ^8.3.8
  "vitest": 4.1.12
  "@vitest/coverage-v8": 4.1.12
  "@vitejs/plugin-react": ^6.3.0
  "@types/node": ^26.6.6

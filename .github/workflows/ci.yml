name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    # Required status check on main: keep this name stable.
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: UI conventions check
        run: pnpm check:ui-conventions

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check generated API contract
        run: pnpm check:api-contract

      - name: Build Docker image
        run: docker build --tag bttf-dvd-shop .

      - name: Start container
        run: |
          docker run --detach --name bttf-dvd-shop --publish 3000:3000 --health-interval 2s bttf-dvd-shop
          timeout 60 sh -c 'until [ "$(docker inspect --format "{{.State.Health.Status}}" bttf-dvd-shop)" = healthy ]; do sleep 1; done' \
            || { docker logs bttf-dvd-shop; exit 1; }

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: End-to-end test
        run: pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results
          if-no-files-found: ignore

      - name: Audit dependencies
        run: pnpm audit
